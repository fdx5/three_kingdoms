# render.com 블루프린트 — 서비스 하나로 게임과 API를 같이 올린다.
#
# 대시보드에서 New > Blueprint 로 이 저장소를 고르면 아래대로 만들어진다.
# 이미 Web Service 를 손으로 만들었다면 Settings 에 같은 값을 넣으면 된다.
# 토르소 접속 정보만 대시보드에서 직접 채운다(sync: false = 저장소에 값이 없다).
services:
  - type: web
    name: three-kingdoms
    runtime: node
    plan: free
    # 토르소 DB가 도쿄(ap-northeast-1)에 있다. 무료 플랜에서 고를 수 있는 것 중 가장 가깝다.
    region: singapore

    # devDependencies 는 저장소의 .npmrc(include=dev) 가 책임진다.
    # Render 가 NODE_ENV=production 을 넣어도 vite 와 typescript 가 설치된다 —
    # 이게 없으면 12개만 깔리고 vite 가 없어서 빌드가 통째로 멈춘다(실측).
    # 여기 --include=dev 를 한 번 더 적은 것은 대시보드에서 이 줄만 복사해 가도
    # 되게 하려는 것이다. 둘 다 있어도 문제 없다.
    #
    # `build` 는 vite build 하나다. tsc --noEmit 을 여기 묶어 두면 배포가 타입 검사
    # 때문에 멈추는데, 그건 로컬(`npm run typecheck`)의 몫이다.
    #
    # VITE_API_BASE=/api 를 빌드에 박는다 — 배포된 게임은 같은 오리진의 API 를 쓴다.
    # 로컬 .env 에서는 비워 두므로 개발할 때는 서버 없이 localStorage 로 논다.
    buildCommand: npm ci --include=dev && VITE_API_BASE=/api npm run build

    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      # 접속 정보는 저장소에 없다. 대시보드 Environment 에서 채운다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
