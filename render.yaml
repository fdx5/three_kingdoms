# render.com 블루프린트 — 서비스 하나로 게임과 API를 같이 올린다.
#
# 대시보드에서 New > Blueprint 로 이 저장소를 고르면 아래대로 만들어진다.
# 이미 Web Service 를 손으로 만들었다면 Settings 에 같은 값을 넣으면 된다.
# 토르소 접속 정보만 대시보드에서 직접 채운다(sync: false = 저장소에 값이 없다).
services:
  - type: web
    name: three-kingdoms
    runtime: node
    plan: free
    # 토르소 DB가 도쿄(ap-northeast-1)에 있다. 무료 플랜에서 고를 수 있는 것 중 가장 가깝다.
    region: singapore

    # `--include=dev` 가 핵심이다.
    #
    # Render 는 Node 서비스에 NODE_ENV=production 을 기본으로 넣는다. 그대로 두면
    # npm 이 devDependencies 를 건너뛰어 vite 와 typescript 가 없는 채로 빌드에 들어간다.
    # 빌드 도구는 전부 devDependencies 에 있으므로 설치 단계에서만 명시적으로 켠다.
    #
    # 빌드는 `build:app`(= vite build) 을 쓴다. `build` 는 tsc --noEmit 이 앞에 붙는데,
    # 그건 scripts/ 의 에셋 파이프라인까지 훑어서 배포 서버에서 돌릴 이유가 없다.
    # 타입 검사는 로컬과 CI 의 몫이다.
    #
    # VITE_API_BASE=/api 를 빌드에 박는다 — 배포된 게임은 같은 오리진의 API 를 쓴다.
    # 로컬 .env 에서는 비워 두므로 개발할 때는 서버 없이 localStorage 로 논다.
    buildCommand: npm ci --include=dev && VITE_API_BASE=/api npm run build:app

    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      # 접속 정보는 저장소에 없다. 대시보드 Environment 에서 채운다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
