# render.com 블루프린트 — 서비스 하나로 게임과 API를 같이 올린다.
#
# 대시보드에서 New > Blueprint 로 이 저장소를 고르면 아래대로 만들어진다.
#
# ⚠ 손으로 만든 Web Service 는 이 파일을 **읽지 않는다**. 그 경우 Settings 의
#   Build Command / Start Command 에 아래 값을 직접 넣어야 한다. 안 넣으면
#   설치가 돌지 않은 채 빌드만 시도해서 `sh: 1: vite: not found` 로 죽는다.
#   (그래도 죽지 않도록 package.json 에 prebuild 안전장치를 뒀다 —
#    scripts/ensure-deps.mjs 가 의존성이 없으면 그 자리에서 깐다.)
#
# 토르소 접속 정보만 대시보드에서 직접 채운다(sync: false = 저장소에 값이 없다).
services:
  - type: web
    name: three-kingdoms
    runtime: node
    plan: free
    # 토르소 DB가 도쿄(ap-northeast-1)에 있다. 무료 플랜에서 고를 수 있는 것 중 가장 가깝다.
    region: singapore

    # 플래그가 필요 없다. Render 가 NODE_ENV=production 을 넣어 devDependencies 를
    # 건너뛰어도, 빌드와 기동에 필요한 것(vite · tsx · three · @libsql/client)은
    # 전부 dependencies 에 있다. 실측(리눅스): 이 명령으로 30개가 깔리고 빌드가 끝난다.
    #
    # `build` 는 vite build 하나다. tsc --noEmit 을 여기 묶어 두면 배포가 타입 검사
    # 때문에 멈추는데, 그건 로컬(`npm run typecheck`)의 몫이다.
    #
    # VITE_API_BASE=/api 를 빌드에 박는다 — 배포된 게임은 같은 오리진의 API 를 쓴다.
    # 로컬 .env 에서는 비워 두므로 개발할 때는 서버 없이 localStorage 로 논다.
    buildCommand: npm ci && VITE_API_BASE=/api npm run build

    startCommand: npm start
    healthCheckPath: /api/health

    # ⚠ 무료 플랜은 15분 무접속이면 인스턴스를 재운다. server/keepalive.ts 가
    #   10분마다 자기 /api/health 를 두드려 막고, 이미 잠든 경우를 위해
    #   .github/workflows/keepalive.yml 이 밖에서도 두드린다.
    #   주소(RENDER_EXTERNAL_URL)는 Render 가 자동으로 넣어 주므로 여기 없어도 된다.
    #   끄려면 대시보드에 KEEPALIVE=off. 자세한 것은 README 의 "스핀다운" 절.
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 접속 정보는 저장소에 없다. 대시보드 Environment 에서 채운다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
